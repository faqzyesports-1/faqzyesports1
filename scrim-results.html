<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scrim Results</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0d12;color:#f8fafc;font-family:Arial,Helvetica,sans-serif}
header{background:#11141b;border-bottom:1px solid #252a35;padding:22px 24px}
.header-inner{max-width:1120px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:16px}
.logo{font-size:28px;font-weight:800}.subtitle{color:#9ca3af;margin-top:6px}
.back{color:#fff;text-decoration:none;background:#374151;padding:10px 14px;border-radius:8px;white-space:nowrap}
.container{max-width:1120px;margin:32px auto;padding:0 20px}
.card{background:#11141b;border:1px solid #252a35;border-radius:14px;padding:24px;margin-bottom:20px}
h1,h2,h3,h4{margin-top:0}h1{font-size:30px;margin-bottom:8px}.intro,.note{color:#9ca3af}
.message{display:none;padding:12px 14px;border-radius:8px;margin-bottom:18px;font-weight:700}
.message.success{display:block;background:#064e3b;color:#a7f3d0}.message.error{display:block;background:#7f1d1d;color:#fecaca}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}
label{font-weight:700;font-size:14px;color:#d1d5db}
input,select,textarea{width:100%;font:inherit;color:#f8fafc;background:#0b0d12;border:1px solid #374151;border-radius:8px;padding:11px 12px}
textarea{min-height:90px;resize:vertical}
button{font:inherit;border:0;border-radius:8px;padding:11px 15px;cursor:pointer;font-weight:700}
button:hover{filter:brightness(1.08)}.primary{background:#2563eb;color:#fff}.secondary{background:#374151;color:#fff}.danger-button,.small-delete-button{background:#7f1d1d;color:#fecaca}
.form-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.selected-team{display:none;gap:16px;align-items:flex-start;background:#172033;border:1px solid #263b60;border-radius:9px;padding:14px;margin:16px 0}
.selected-team-content{flex:1}.selected-team-title{font-weight:700;margin-bottom:10px}.player-selection{display:flex;flex-wrap:wrap;gap:8px}
.player-option{display:flex;align-items:center;gap:8px;background:#0b0d12;border:1px solid #374151;border-radius:8px;padding:8px 10px;cursor:pointer}
.player-option.checked{border-color:#60a5fa;background:#172554}.player-checkbox-input{width:auto}.player-count,.empty,.no-players{color:#9ca3af;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}.stat{background:#0b0d12;border:1px solid #252a35;border-radius:10px;padding:16px}.stat-value{font-size:28px;font-weight:800}.stat-label{color:#9ca3af;font-size:13px;margin-top:4px}
.team-management-list{display:grid;gap:8px}.team-management-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #252a35}.team-management-row:last-child{border-bottom:0}.team-management-name{font-weight:700}.team-management-source{color:#9ca3af;font-size:13px;margin-top:4px}
.result-card{background:#0b0d12;border:1px solid #252a35;border-radius:12px;padding:18px;margin-top:14px}.result-top,.result-bottom{display:flex;justify-content:space-between;align-items:center;gap:12px}.result-date{color:#9ca3af}.format-badge{background:#1e3a8a;color:#bfdbfe;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:700}.matchup{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:18px;padding:24px 0}.match-team:last-child{text-align:right}.match-team-name{font-size:20px;font-weight:800}.match-team-role{color:#9ca3af;font-size:12px;margin-top:4px}.match-score{font-size:27px;font-weight:800;color:#60a5fa;white-space:nowrap}.result-details{display:grid;grid-template-columns:1fr 1fr;gap:12px}.detail-box{background:#11141b;border-radius:8px;padding:12px}.detail-title{font-size:13px;color:#9ca3af;font-weight:700;margin-bottom:8px}.player-tags{display:flex;flex-wrap:wrap;gap:6px}.player-tag{background:#1e3a8a;color:#bfdbfe;border-radius:999px;padding:5px 8px;font-size:12px}.notes{color:#cbd5e1;border-top:1px solid #252a35;margin-top:14px;padding-top:14px;line-height:1.5}.result-bottom{border-top:1px solid #252a35;margin-top:16px;padding-top:14px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);align-items:center;justify-content:center;padding:20px;z-index:10}.modal.show{display:flex}.modal-content{width:min(560px,100%);background:#11141b;border:1px solid #374151;border-radius:14px;padding:24px}.player-input-row{display:flex;gap:8px;margin-top:8px}.player-input-row input{flex:1}.remove-player-input{padding:8px 12px;background:#374151;color:#fff}.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
@media(max-width:700px){.header-inner{align-items:flex-start;flex-direction:column}.form-grid,.result-details{grid-template-columns:1fr}.field.full{grid-column:auto}.stats{grid-template-columns:1fr}.matchup{grid-template-columns:1fr;text-align:center}.match-team:last-child{text-align:center}}
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div><div class="logo">🎮 Scrim Results</div><div class="subtitle">Record and review your team’s scrim history.</div></div>
    <a class="back" href="index.html">← Team Hub</a>
  </div>
</header>

<main class="container">
  <div id="message" class="message"></div>

  <section class="card">
    <h1>Record a scrim</h1>
    <p class="intro">Choose your team, record the players and save the result.</p>
    <div class="form-grid">
      <div class="field">
        <label for="yourTeam">Your team</label>
        <select id="yourTeam" onchange="teamChanged()"></select>
      </div>
      <div class="field">
        <label>&nbsp;</label>
        <button type="button" class="secondary" onclick="openAddTeamModal()">+ Add Team</button>
      </div>
      <div id="selectedTeamBox" class="selected-team field full">
        <div class="selected-team-content">
          <div class="selected-team-title">Players from <span id="selectedTeamName"></span></div>
          <div id="playerSelection" class="player-selection"></div>
          <div id="playerCount" class="player-count">0 selected</div>
        </div>
      </div>
      <div class="field">
        <label for="opponent">Opponent</label>
        <input id="opponent" type="text" placeholder="Opponent team">
      </div>
      <div class="field">
        <label for="date">Date</label>
        <input id="date" type="date">
      </div>
      <div class="field">
        <label for="scoreA">Your score</label>
        <input id="scoreA" type="number" min="0" step="1" placeholder="0">
      </div>
      <div class="field">
        <label for="scoreB">Opponent score</label>
        <input id="scoreB" type="number" min="0" step="1" placeholder="0">
      </div>
      <div class="field">
        <label for="format">Format</label>
        <select id="format">
          <option value="BO1">Best of 1</option>
          <option value="BO3">Best of 3</option>
          <option value="BO5">Best of 5</option>
          <option value="BO7">Best of 7</option>
          <option value="1H">1 Hour Scrim</option>
          <option value="CUSTOM">Custom</option>
        </select>
      </div>
      <div class="field full">
        <label for="notes">Notes</label>
        <textarea id="notes" placeholder="Optional notes about the scrim"></textarea>
      </div>
    </div>
    <div class="form-actions">
      <button type="button" class="primary" onclick="saveScrim()">Save Scrim Result</button>
      <button type="button" class="secondary" onclick="resetForm()">Clear</button>
    </div>
  </section>

  <section class="card">
    <h2>Your teams</h2>
    <div id="teamManagementList" class="team-management-list"></div>
  </section>

  <section class="card">
    <h2>Overview</h2>
    <div class="stats">
      <div class="stat"><div id="totalScrims" class="stat-value">0</div><div class="stat-label">Scrim results</div></div>
      <div class="stat"><div id="totalTeams" class="stat-value">0</div><div class="stat-label">Teams</div></div>
      <div class="stat"><div id="totalPlayers" class="stat-value">0</div><div class="stat-label">Players</div></div>
    </div>
  </section>

  <section class="card">
    <h2>Scrim history</h2>
    <div id="resultsList"></div>
  </section>
</main>

<div id="addTeamModal" class="modal" onclick="closeModalOnOverlay(event)">
  <div class="modal-content">
    <h2>Add a team</h2>
    <div class="field">
      <label for="newTeamName">Team name</label>
      <input id="newTeamName" type="text" placeholder="Team name">
    </div>
    <div class="field" style="margin-top:16px">
      <label>Players</label>
      <div id="newTeamPlayers"></div>
      <button type="button" class="secondary" style="margin-top:10px" onclick="addPlayerInput()">+ Add player</button>
    </div>
    <div class="modal-actions">
      <button type="button" class="secondary" onclick="closeAddTeamModal()">Cancel</button>
      <button type="button" class="primary" onclick="createTeam()">Create team</button>
    </div>
  </div>
</div>

<script>

    /* ==================================================
       DATA
    ================================================== */

    let teams =
        JSON.parse(
            localStorage.getItem("scrimTeams")
        ) || [];

    let scrims =
        JSON.parse(
            localStorage.getItem("scrimResults")
        ) || [];

    let pendingDeleteTeamId =
        null;

    let pendingDeleteScrimId =
        null;

    const SHARED_API_URL =
        "/api/state/scrims";

    let sharedScrimStateReady =
        false;

    let pendingSharedScrimSave =
        false;

    let sharedScrimSaveInFlight =
        false;

    let sharedScrimUpdatedAt =
        null;


    /* ==================================================
       NORMALIZE EXISTING DATA
    ================================================== */

    teams = teams.map(team => {

        if (!Array.isArray(team.players)) {

            if (Array.isArray(team.people)) {

                team.players =
                    team.people
                        .map(person => {

                            if (
                                typeof person === "string"
                            ) {
                                return person;
                            }

                            return person.name || "";

                        })
                        .filter(Boolean);

            } else {

                team.players = [];

            }

        }

        /*
         * Geef oude teams zonder ID alsnog
         * een unieke ID.
         */

        if (
            team.id === undefined ||
            team.id === null ||
            String(team.id).trim() === ""
        ) {

            team.id =
                "team_" +
                Date.now() +
                "_" +
                Math.random()
                    .toString(36)
                    .substring(2, 9);

        }

        return team;

    });


    /*
     * Zorg dat oude scrims ook een ID hebben.
     */

    scrims = scrims.map(scrim => {

        if (
            scrim.id === undefined ||
            scrim.id === null ||
            String(scrim.id).trim() === ""
        ) {

            scrim.id =
                "scrim_" +
                Date.now() +
                "_" +
                Math.random()
                    .toString(36)
                    .substring(2, 9);

        }

        return scrim;

    });


    /* ==================================================
       INIT
    ================================================== */

    document.addEventListener(
        "DOMContentLoaded",
        function() {

            setToday();

            populateTeams();

            renderTeamManagement();

            renderStats();

            renderResults();

            hydrateSharedScrimState();

            setInterval(
                function() {
                    hydrateSharedScrimState();
                },
                5000
            );

        }
    );


    /* ==================================================
       DATE
    ================================================== */

    function setToday() {

        const today =
            new Date();

        const year =
            today.getFullYear();

        const month =
            String(
                today.getMonth() + 1
            ).padStart(2, "0");

        const day =
            String(
                today.getDate()
            ).padStart(2, "0");

        document.getElementById(
            "date"
        ).value =
            `${year}-${month}-${day}`;

    }


    /* ==================================================
       STORAGE
    ================================================== */

    function saveTeams() {

        localStorage.setItem(
            "scrimTeams",
            JSON.stringify(teams)
        );

        pendingSharedScrimSave =
            true;

        flushSharedScrimSave();

    }


    function saveScrims() {

        localStorage.setItem(
            "scrimResults",
            JSON.stringify(scrims)
        );

        pendingSharedScrimSave =
            true;

        flushSharedScrimSave();

    }


    async function flushSharedScrimSave() {

        if (
            !sharedScrimStateReady ||
            sharedScrimSaveInFlight ||
            !pendingSharedScrimSave
        ) {

            return;

        }


        sharedScrimSaveInFlight =
            true;

        pendingSharedScrimSave =
            false;


        try {

            const response =
                await fetch(
                    SHARED_API_URL,
                    {
                        method:
                            "PUT",
                        headers: {
                            "Content-Type":
                                "application/json"
                        },
                        body:
                            JSON.stringify({
                                teams:
                                    teams,
                                results:
                                    scrims
                            })
                    }
                );


            if (!response.ok) {

                throw new Error(
                    "Shared scrim save failed"
                );

            }


            const result =
                await response.json();

            sharedScrimUpdatedAt =
                result.updatedAt ||
                sharedScrimUpdatedAt;

        } catch (error) {

            pendingSharedScrimSave =
                true;

            console.warn(
                "Shared scrim save failed.",
                error
            );

        } finally {

            sharedScrimSaveInFlight =
                false;

            if (
                pendingSharedScrimSave
            ) {

                flushSharedScrimSave();

            }

        }

    }


    function applySharedScrimState(
        sharedData
    ) {

        if (
            !sharedData ||
            !Array.isArray(
                sharedData.teams
            ) ||
            !Array.isArray(
                sharedData.results
            )
        ) {

            return;

        }


        teams =
            sharedData.teams;

        scrims =
            sharedData.results;

        localStorage.setItem(
            "scrimTeams",
            JSON.stringify(teams)
        );

        localStorage.setItem(
            "scrimResults",
            JSON.stringify(scrims)
        );

    }


    async function hydrateSharedScrimState() {

        try {

            const response =
                await fetch(
                    SHARED_API_URL,
                    {
                        cache:
                            "no-store"
                    }
                );


            if (!response.ok) {

                throw new Error(
                    "Shared scrim state unavailable"
                );

            }


            const state =
                await response.json();


            if (
                state.exists
            ) {

                if (
                    state.updatedAt ===
                    sharedScrimUpdatedAt
                ) {

                    return;

                }


                pendingSharedScrimSave =
                    false;

                applySharedScrimState(
                    state.data
                );

                sharedScrimUpdatedAt =
                    state.updatedAt ||
                    null;

            } else if (
                teams.length ||
                scrims.length
            ) {

                sharedScrimStateReady =
                    true;

                pendingSharedScrimSave =
                    true;

                await flushSharedScrimSave();

                return;

            }


            sharedScrimStateReady =
                true;

            await flushSharedScrimSave();

            populateTeams();

            renderTeamManagement();

            renderStats();

            renderResults();

        } catch (error) {

            sharedScrimStateReady =
                true;

            console.warn(
                "Shared scrim state load failed.",
                error
            );

        }

    }


    /* ==================================================
       POPULATE TEAMS
    ================================================== */

    function populateTeams(
        selectedTeamId = null
    ) {

        const select =
            document.getElementById(
                "yourTeam"
            );


        const currentValue =
            selectedTeamId !== null
                ? String(selectedTeamId)
                : String(select.value || "");


        select.innerHTML =
            `
            <option value="">
                Select your team
            </option>
            `;


        teams.forEach(
            team => {

                const option =
                    document.createElement(
                        "option"
                    );

                option.value =
                    String(team.id);

                option.textContent =
                    team.name;

                select.appendChild(
                    option
                );

            }
        );


        /*
         * Selecteer het team opnieuw
         * als het nog bestaat.
         */

        if (
            currentValue &&
            teams.some(
                team =>
                    String(team.id) ===
                    currentValue
            )
        ) {

            select.value =
                currentValue;

        }

    }


    /* ==================================================
       TEAM CHANGED
    ================================================== */

    function teamChanged() {

        const teamId =
            document.getElementById(
                "yourTeam"
            ).value;


        const team =
            teams.find(
                item =>
                    String(item.id) ===
                    String(teamId)
            );


        const selectedBox =
            document.getElementById(
                "selectedTeamBox"
            );


        const selectedName =
            document.getElementById(
                "selectedTeamName"
            );


        if (!team) {

            selectedBox.style.display =
                "none";

            renderPlayers([]);

            return;

        }


        selectedBox.style.display =
            "flex";


        selectedName.textContent =
            team.name;


        renderPlayers(
            team.players || []
        );

    }


    /* ==================================================
       PLAYERS
    ================================================== */

    function renderPlayers(
        players
    ) {

        const container =
            document.getElementById(
                "playerSelection"
            );


        container.innerHTML =
            "";


        if (
            !players ||
            players.length === 0
        ) {

            container.innerHTML =
                `
                <div class="no-players">
                    This team has no players yet.
                    Add players when creating the team.
                </div>
                `;

            updatePlayerCount();

            return;

        }


        players.forEach(
            player => {

                const label =
                    document.createElement(
                        "label"
                    );


                label.className =
                    "player-option";


                const checkbox =
                    document.createElement(
                        "input"
                    );


                checkbox.type =
                    "checkbox";

                checkbox.className =
                    "player-checkbox-input";

                checkbox.value =
                    player;


                checkbox.addEventListener(
                    "change",
                    function() {

                        label.classList.toggle(
                            "checked",
                            checkbox.checked
                        );

                        updatePlayerCount();

                    }
                );


                const name =
                    document.createElement(
                        "span"
                    );


                name.className =
                    "player-name";

                name.textContent =
                    player;


                label.appendChild(
                    checkbox
                );

                label.appendChild(
                    name
                );


                container.appendChild(
                    label
                );

            }
        );


        updatePlayerCount();

    }


    function updatePlayerCount() {

        const checked =
            document.querySelectorAll(
                ".player-checkbox-input:checked"
            );


        document.getElementById(
            "playerCount"
        ).textContent =
            `${checked.length} selected`;

    }


    function getSelectedPlayers() {

        return [
            ...document.querySelectorAll(
                ".player-checkbox-input:checked"
            )
        ].map(
            checkbox =>
                checkbox.value
        );

    }


    /* ==================================================
       ADD TEAM MODAL
    ================================================== */

    function openAddTeamModal() {

        document.getElementById(
            "newTeamName"
        ).value =
            "";


        document.getElementById(
            "newTeamPlayers"
        ).innerHTML =
            "";


        addPlayerInput();


        document.getElementById(
            "addTeamModal"
        ).classList.add("show");


        setTimeout(
            function() {

                document.getElementById(
                    "newTeamName"
                ).focus();

            },
            50
        );

    }


    function closeAddTeamModal() {

        document.getElementById(
            "addTeamModal"
        ).classList.remove("show");

    }


    function closeModalOnOverlay(
        event
    ) {

        if (
            event.target.id ===
            "addTeamModal"
        ) {

            closeAddTeamModal();

        }

    }


    /* ==================================================
       ADD PLAYER INPUT
    ================================================== */

    function addPlayerInput(
        value = ""
    ) {

        const container =
            document.getElementById(
                "newTeamPlayers"
            );


        const row =
            document.createElement(
                "div"
            );


        row.className =
            "player-input-row";


        const input =
            document.createElement(
                "input"
            );


        input.type =
            "text";

        input.className =
            "new-player-input";

        input.placeholder =
            "Player name";

        input.value =
            value;


        const remove =
            document.createElement(
                "button"
            );


        remove.type =
            "button";

        remove.className =
            "remove-player-input";

        remove.textContent =
            "×";


        remove.addEventListener(
            "click",
            function() {

                row.remove();

            }
        );


        row.appendChild(
            input
        );

        row.appendChild(
            remove
        );


        container.appendChild(
            row
        );

    }


    /* ==================================================
       CREATE TEAM
    ================================================== */

    function createTeam() {

        const name =
            document.getElementById(
                "newTeamName"
            ).value.trim();


        if (!name) {

            showMessage(
                "Please enter a team name.",
                "error"
            );

            return;

        }


        const duplicate =
            teams.some(
                team =>
                    String(team.name)
                        .trim()
                        .toLowerCase() ===
                    name.toLowerCase()
            );


        if (duplicate) {

            showMessage(
                "A team with this name already exists.",
                "error"
            );

            return;

        }


        const playerInputs =
            document.querySelectorAll(
                ".new-player-input"
            );


        const players =
            [
                ...playerInputs
            ]
            .map(
                input =>
                    input.value.trim()
            )
            .filter(Boolean);


        const uniquePlayers =
            [...new Set(players)];


        const newTeam = {

            id:
                "team_" +
                Date.now() +
                "_" +
                Math.random()
                    .toString(36)
                    .substring(2, 9),

            name:
                name,

            players:
                uniquePlayers,

            createdAt:
                new Date().toISOString(),

            source:
                "scrim-results"

        };


        teams.push(
            newTeam
        );


        saveTeams();


        populateTeams(
            newTeam.id
        );


        renderTeamManagement();

        renderStats();


        document.getElementById(
            "yourTeam"
        ).value =
            String(newTeam.id);


        teamChanged();


        closeAddTeamModal();


        showMessage(
            `Team "${name}" has been added.`,
            "success"
        );

    }


    /* ==================================================
       MANAGE TEAMS
    ================================================== */

    function renderTeamManagement() {

        pendingDeleteTeamId =
            null;

        const container =
            document.getElementById(
                "teamManagementList"
            );


        container.innerHTML =
            "";


        if (
            teams.length === 0
        ) {

            container.innerHTML =
                `
                <div class="team-empty">
                    No teams available yet.
                </div>
                `;

            return;

        }


        teams.forEach(
            team => {

                const row =
                    document.createElement(
                        "div"
                    );


                row.className =
                    "team-management-row";


                const info =
                    document.createElement(
                        "div"
                    );


                const name =
                    document.createElement(
                        "div"
                    );


                name.className =
                    "team-management-name";


                name.textContent =
                    team.name;


                const source =
                    document.createElement(
                        "div"
                    );


                source.className =
                    "team-management-source";


                source.textContent =
                    `${(team.players || []).length} player(s)`;


                info.appendChild(
                    name
                );

                info.appendChild(
                    source
                );


                const deleteButton =
                    document.createElement(
                        "button"
                    );


                deleteButton.type =
                    "button";

                deleteButton.className =
                    "small-delete-button";

                deleteButton.textContent =
                    "Delete";


                /*
                 * Belangrijk:
                 * gebruik hier geen inline onclick.
                 * We geven de exacte team-ID mee
                 * aan deleteTeam().
                 */

                deleteButton.addEventListener(
                    "click",
                    function(event) {

                        event.preventDefault();

                        event.stopPropagation();

                        if (
                            pendingDeleteTeamId !==
                            String(team.id)
                        ) {

                            pendingDeleteTeamId =
                                String(team.id);

                            deleteButton.textContent =
                                "Confirm delete";

                            deleteButton.setAttribute(
                                "aria-label",
                                "Confirm deleting " +
                                team.name
                            );

                            const relatedScrims =
                                scrims.filter(
                                    scrim =>
                                        String(scrim.teamId) ===
                                        String(team.id)
                                );

                            showMessage(
                                relatedScrims.length > 0
                                    ? "This team has " +
                                      relatedScrims.length +
                                      " saved scrim result(s). Click Confirm delete to remove only the team."
                                    : "Click Confirm delete to remove this team.",
                                "error"
                            );

                            return;

                        }

                        deleteTeam(
                            team.id
                        );

                    }
                );


                row.appendChild(
                    info
                );

                row.appendChild(
                    deleteButton
                );


                container.appendChild(
                    row
                );

            }
        );

    }


    /* ==================================================
       DELETE TEAM
    ================================================== */

    function deleteTeam(
        teamId
    ) {

        /*
         * Zoek het team op basis van
         * de daadwerkelijke ID.
         */

        const teamIndex =
            teams.findIndex(
                team =>
                    String(team.id) ===
                    String(teamId)
            );


        if (
            teamIndex === -1
        ) {

            showMessage(
                "Team could not be found.",
                "error"
            );

            return;

        }


        const team =
            teams[teamIndex];


        /*
         * Controleer of dit team
         * voorkomt in bestaande scrims.
         */

        const relatedScrims =
            scrims.filter(
                scrim =>
                    String(scrim.teamId) ===
                    String(teamId)
            );


        /*
         * Verwijder exact dit team
         * uit de teams-array.
         */

        teams.splice(
            teamIndex,
            1
        );

        pendingDeleteTeamId =
            null;


        /*
         * Sla de gewijzigde teams op.
         */

        saveTeams();


        /*
         * Maak dropdown opnieuw.
         */

        populateTeams();


        /*
         * Verwijderde team mag niet
         * geselecteerd blijven.
         */

        const teamSelect =
            document.getElementById(
                "yourTeam"
            );


        teamSelect.value =
            "";


        document.getElementById(
            "selectedTeamBox"
        ).style.display =
            "none";


        renderPlayers([]);


        /*
         * Update alles op de pagina.
         */

        renderTeamManagement();

        renderStats();


        showMessage(
            `Team "${team.name}" has been deleted successfully.`,
            "success"
        );

    }


    /* ==================================================
       SAVE SCRIM
    ================================================== */

    function saveScrim() {

        const teamId =
            document.getElementById(
                "yourTeam"
            ).value;


        const team =
            teams.find(
                item =>
                    String(item.id) ===
                    String(teamId)
            );


        const opponent =
            document.getElementById(
                "opponent"
            ).value.trim();


        const players =
            getSelectedPlayers();


        const date =
            document.getElementById(
                "date"
            ).value;


        const scoreA =
            document.getElementById(
                "scoreA"
            ).value;


        const scoreB =
            document.getElementById(
                "scoreB"
            ).value;


        const format =
            document.getElementById(
                "format"
            ).value;


        const notes =
            document.getElementById(
                "notes"
            ).value.trim();


        if (!team) {

            showMessage(
                "Please select your team.",
                "error"
            );

            return;

        }


        if (!opponent) {

            showMessage(
                "Please enter the opponent.",
                "error"
            );

            return;

        }


        if (
            players.length === 0
        ) {

            showMessage(
                "Please select at least one player who played.",
                "error"
            );

            return;

        }


        if (!date) {

            showMessage(
                "Please select the date.",
                "error"
            );

            return;

        }


        if (
            scoreA === "" ||
            scoreB === ""
        ) {

            showMessage(
                "Please enter both scores.",
                "error"
            );

            return;

        }


        const result = {

            id:
                "scrim_" +
                Date.now() +
                "_" +
                Math.random()
                    .toString(36)
                    .substring(2, 9),

            teamId:
                team.id,

            teamName:
                team.name,

            opponent:
                opponent,

            players:
                players,

            scoreA:
                Number(scoreA),

            scoreB:
                Number(scoreB),

            format:
                format,

            date:
                date,

            notes:
                notes,

            createdAt:
                new Date().toISOString()

        };


        scrims.unshift(
            result
        );


        saveScrims();


        renderStats();

        renderResults();

        resetForm();


        showMessage(
            "Scrim result saved successfully.",
            "success"
        );

    }


    /* ==================================================
       RESET FORM
    ================================================== */

    function resetForm() {

        document.getElementById(
            "yourTeam"
        ).value =
            "";


        document.getElementById(
            "opponent"
        ).value =
            "";


        document.getElementById(
            "scoreA"
        ).value =
            "";


        document.getElementById(
            "scoreB"
        ).value =
            "";


        document.getElementById(
            "notes"
        ).value =
            "";


        document.getElementById(
            "format"
        ).value =
            "BO1";


        document.getElementById(
            "selectedTeamBox"
        ).style.display =
            "none";


        renderPlayers([]);

        setToday();

    }


    /* ==================================================
       STATS
    ================================================== */

    function renderStats() {

        document.getElementById(
            "totalScrims"
        ).textContent =
            scrims.length;


        document.getElementById(
            "totalTeams"
        ).textContent =
            teams.length;


        const playerNames =
            new Set();


        teams.forEach(
            team => {

                (team.players || [])
                    .forEach(
                        player =>
                            playerNames.add(
                                player
                            )
                    );

            }
        );


        document.getElementById(
            "totalPlayers"
        ).textContent =
            playerNames.size;

    }


    /* ==================================================
       RENDER RESULTS
    ================================================== */

    function renderResults() {

        pendingDeleteScrimId =
            null;

        const container =
            document.getElementById(
                "resultsList"
            );


        container.innerHTML =
            "";


        if (
            scrims.length === 0
        ) {

            container.innerHTML =
                `
                <div class="empty">

                    <div class="empty-icon">
                        🎮
                    </div>

                    <h4>
                        No scrim results yet
                    </h4>

                    <p>
                        Add your first scrim result above.
                    </p>

                </div>
                `;

            return;

        }


        scrims.forEach(
            scrim => {

                container.appendChild(
                    createResultCard(
                        scrim
                    )
                );

            }
        );

    }


    /* ==================================================
       CREATE RESULT CARD
    ================================================== */

    function createResultCard(
        scrim
    ) {

        const card =
            document.createElement(
                "div"
            );


        card.className =
            "result-card";


        /* TOP */

        const top =
            document.createElement(
                "div"
            );


        top.className =
            "result-top";


        const date =
            document.createElement(
                "span"
            );


        date.className =
            "result-date";


        date.textContent =
            formatDate(
                scrim.date
            );


        const format =
            document.createElement(
                "span"
            );


        format.className =
            "format-badge";


        format.textContent =
            formatName(
                scrim.format
            );


        top.appendChild(
            date
        );


        top.appendChild(
            format
        );


        /* MAIN */

        const main =
            document.createElement(
                "div"
            );


        main.className =
            "result-main";


        const matchup =
            document.createElement(
                "div"
            );


        matchup.className =
            "matchup";


        const yourTeam =
            document.createElement(
                "div"
            );


        yourTeam.className =
            "match-team";


        yourTeam.innerHTML =
            `
            <div class="match-team-name">
                ${escapeHTML(scrim.teamName)}
            </div>

            <div class="match-team-role">
                Your Team
            </div>
            `;


        const score =
            document.createElement(
                "div"
            );


        score.className =
            "match-score";


        score.textContent =
            `${scrim.scoreA} : ${scrim.scoreB}`;


        const opponent =
            document.createElement(
                "div"
            );


        opponent.className =
            "match-team";


        opponent.innerHTML =
            `
            <div class="match-team-name">
                ${escapeHTML(scrim.opponent)}
            </div>

            <div class="match-team-role">
                Opponent
            </div>
            `;


        matchup.appendChild(
            yourTeam
        );


        matchup.appendChild(
            score
        );


        matchup.appendChild(
            opponent
        );


        main.appendChild(
            matchup
        );


        /* DETAILS */

        const details =
            document.createElement(
                "div"
            );


        details.className =
            "result-details";


        const playersBox =
            document.createElement(
                "div"
            );


        playersBox.className =
            "detail-box";


        const title =
            document.createElement(
                "div"
            );


        title.className =
            "detail-title";


        title.textContent =
            "Players Who Played";


        playersBox.appendChild(
            title
        );


        const tags =
            document.createElement(
                "div"
            );


        tags.className =
            "player-tags";


        (scrim.players || [])
            .forEach(
                player => {

                    const tag =
                        document.createElement(
                            "span"
                        );


                    tag.className =
                        "player-tag";


                    tag.textContent =
                        player;


                    tags.appendChild(
                        tag
                    );

                }
            );


        playersBox.appendChild(
            tags
        );


        const infoBox =
            document.createElement(
                "div"
            );


        infoBox.className =
            "detail-box";


        infoBox.innerHTML =
            `
            <div class="detail-title">
                Match Details
            </div>

            <div style="color:#aeb7c7;font-size:13px;">
                ${escapeHTML(
                    formatName(scrim.format)
                )}
            </div>

            <div style="color:#69758a;font-size:11px;margin-top:4px;">
                ${formatDate(scrim.date)}
            </div>
            `;


        details.appendChild(
            playersBox
        );


        details.appendChild(
            infoBox
        );


        main.appendChild(
            details
        );


        /* NOTES */

        if (scrim.notes) {

            const notes =
                document.createElement(
                    "div"
                );


            notes.className =
                "notes";


            notes.innerHTML =
                `
                <strong style="color:#aeb7c7;">
                    Notes:
                </strong>
                ${escapeHTML(scrim.notes)}
                `;


            main.appendChild(
                notes
            );

        }


        /* DELETE */

        const bottom =
            document.createElement(
                "div"
            );


        bottom.className =
            "result-bottom";


        const deleteButton =
            document.createElement(
                "button"
            );


        deleteButton.type =
            "button";


        deleteButton.className =
            "danger-button";


        deleteButton.textContent =
            "Delete";


        /*
         * Belangrijk:
         * Geen inline onclick.
         * We koppelen de exacte scrim
         * aan de button.
         */

        deleteButton.addEventListener(
            "click",
            function(event) {

                event.preventDefault();

                event.stopPropagation();

                if (
                    pendingDeleteScrimId !==
                    String(scrim.id)
                ) {

                    pendingDeleteScrimId =
                        String(scrim.id);

                    deleteButton.textContent =
                        "Confirm delete";

                    deleteButton.setAttribute(
                        "aria-label",
                        "Confirm deleting scrim against " +
                        scrim.opponent
                    );

                    showMessage(
                        "Click Confirm delete to remove this scrim result.",
                        "error"
                    );

                    return;

                }

                deleteScrim(
                    scrim.id
                );

            }
        );


        bottom.appendChild(
            deleteButton
        );


        card.appendChild(
            top
        );

        card.appendChild(
            main
        );

        card.appendChild(
            bottom
        );


        return card;

    }


    /* ==================================================
       DELETE SCRIM
    ================================================== */

    function deleteScrim(
        scrimId
    ) {

        /*
         * Zoek de scrim op basis van
         * de exacte ID.
         */

        const scrimIndex =
            scrims.findIndex(
                scrim =>
                    String(scrim.id) ===
                    String(scrimId)
            );


        if (
            scrimIndex === -1
        ) {

            showMessage(
                "Scrim result could not be found.",
                "error"
            );

            return;

        }


        const scrim =
            scrims[scrimIndex];


        /*
         * Verwijder exact deze scrim
         * uit de array.
         */

        scrims.splice(
            scrimIndex,
            1
        );

        pendingDeleteScrimId =
            null;


        /*
         * Sla de gewijzigde lijst op.
         */

        saveScrims();


        /*
         * Render alles opnieuw.
         */

        renderStats();

        renderResults();


        showMessage(
            "Scrim result deleted successfully.",
            "success"
        );

    }


    /* ==================================================
       FORMAT NAME
    ================================================== */

    function formatName(
        format
    ) {

        const names = {

            BO1:
                "Best of 1",

            BO3:
                "Best of 3",

            BO5:
                "Best of 5",

            BO7:
                "Best of 7",

            "1H":
                "1 Hour Scrim",

            CUSTOM:
                "Custom"

        };


        return (
            names[format] ||
            format
        );

    }


    /* ==================================================
       FORMAT DATE
    ================================================== */

    function formatDate(
        date
    ) {

        if (!date) {
            return "-";
        }


        const parts =
            date.split("-");


        if (
            parts.length !== 3
        ) {
            return date;
        }


        return (
            parts[2] +
            "/" +
            parts[1] +
            "/" +
            parts[0]
        );

    }


    /* ==================================================
       MESSAGE
    ================================================== */

    function showMessage(
        text,
        type
    ) {

        const message =
            document.getElementById(
                "message"
            );


        message.className =
            "message " +
            type;


        message.textContent =
            text;


        setTimeout(
            function() {

                message.className =
                    "message";

            },
            3500
        );

    }


    /* ==================================================
       ESCAPE HTML
    ================================================== */

    function escapeHTML(
        text
    ) {

        return String(text)
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );

    }

</script>
